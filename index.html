<!doctype html>
<html lang="es">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: formulario de secretaría en una columna; el panel administrativo usa el mismo lenguaje en ancho completo.
   Paleta: azul, rojo, blanco y negro. El color de cada año: 1º azul, 2º rojo, 3º negro, 4º gris. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#0A0E1A; --muted:#4F586B; --line:#D4D9E4; --tint:#EBF0FB;
  --accent:#1A47C9; --accent-ink:#FFFFFF; --red:#D01F30; --tiza:#D01F30; --tiza-bg:#EBF0FB;
  --ok:#1A47C9; --ok-bg:#E0E9FD; --warn:#0A0E1A; --warn-bg:#E9ECF2; --bad:#C4161F; --bad-bg:#FCE4E6; --info-bg:#E0E9FD; --info:#1A47C9;
  --y-azul:#1A47C9; --y-rojo:#D01F30; --y-verde:#0A0E1A; --y-violeta:#7A8296; --y-naranja:#1A47C9; --y-celeste:#D01F30; --y-lila:#0A0E1A;
  --f-display:'Bricolage Grotesque','Source Sans 3',system-ui,sans-serif;
  --f-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#05070D; --surface:#0E1320; --ink:#F4F6FB; --muted:#A5AEC2; --line:#273049; --tint:#131B2F;
  --accent:#6F92FF; --accent-ink:#05070D; --red:#FF5C69; --tiza:#FF5C69; --tiza-bg:#131B2F;
  --ok:#8FAAFF; --ok-bg:#16244A; --warn:#F4F6FB; --warn-bg:#1B2233; --bad:#FF7A84; --bad-bg:#3A1519; --info-bg:#16244A; --info:#8FAAFF;
  --y-azul:#6F92FF; --y-rojo:#FF5C69; --y-verde:#F4F6FB; --y-violeta:#8E97AD; --y-naranja:#6F92FF; --y-celeste:#FF5C69; --y-lila:#F4F6FB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05070D; --surface:#0E1320; --ink:#F4F6FB; --muted:#A5AEC2; --line:#273049; --tint:#131B2F;
  --accent:#6F92FF; --accent-ink:#05070D; --red:#FF5C69; --tiza:#FF5C69; --tiza-bg:#131B2F;
  --ok:#8FAAFF; --ok-bg:#16244A; --warn:#F4F6FB; --warn-bg:#1B2233; --bad:#FF7A84; --bad-bg:#3A1519; --info-bg:#16244A; --info:#8FAAFF;
  --y-azul:#6F92FF; --y-rojo:#FF5C69; --y-verde:#F4F6FB; --y-violeta:#8E97AD; --y-naranja:#6F92FF; --y-celeste:#FF5C69; --y-lila:#F4F6FB; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.wrap.wide{max-width:1280px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.3rem;line-height:1.2}
h3{font-size:1.02rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Cabecera */
.mast{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:18px;border-bottom:3px solid var(--ink);box-shadow:0 3px 0 var(--red)}
.sello{border:2px solid var(--ink);padding:6px 10px 5px;line-height:1.05;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;gap:2px;min-width:0}
.sello b{font-family:var(--f-display);font-size:1.35rem;letter-spacing:0}
.mast-t{min-width:0}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.05}
.sub{color:var(--muted)}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Plazos */
.plazos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border:1px solid var(--line);background:var(--surface)}
.plazo{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.plazo+.plazo{border-left:1px solid var(--line)}
.plazo .k{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.plazo .v{font-weight:600}
@media (max-width:640px){.plazo+.plazo{border-left:0;border-top:1px solid var(--line)}}

/* Avisos */
.callout{padding:12px 14px;border-left:4px solid var(--info);background:var(--info-bg);border-radius:2px}
.callout.warn{border-color:var(--warn);background:var(--warn-bg)}
.callout.bad{border-color:var(--bad);background:var(--bad-bg)}
.callout.ok{border-color:var(--ok);background:var(--ok-bg)}
.callout strong{display:block}

.sec{display:flex;flex-direction:column;gap:12px}
.sec>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 16px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:4px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sec{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.danger.confirm{background:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:4px 10px;font-size:.9rem}
.btn.lg{min-height:48px;padding:10px 22px;font-size:1.05rem}

/* Formularios */
.card{background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.82rem;font-weight:600;letter-spacing:.02em}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=search],input[type=datetime-local],select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1.5px solid var(--line);background:var(--bg);border-radius:4px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.err{color:var(--bad);font-size:.85rem;min-height:1em}
.field.invalid input,.field.invalid select{border-color:var(--bad)}

/* Lista de mesas */
.anio{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface)}
.anio>h3{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--tint);border-bottom:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.mesa{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.mesa:last-child{border-bottom:0}
.mesa-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.mesa-top label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0;flex:1 1 260px}
.mesa-top input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--accent)}
.mesa.bloq .mesa-top label{cursor:default}
.mnom{font-weight:600}
.mcom{font-weight:400;color:var(--muted)}
.mtrib{font-size:.82rem;color:var(--muted)}
.mfechas{display:flex;gap:8px;flex-wrap:wrap}
.fch{font-family:var(--f-mono);font-size:.82rem;padding:2px 8px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px;padding:12px;background:var(--bg);border:1px dashed var(--line)}
.det fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.det legend{font-size:.82rem;font-weight:600;padding:0;margin-bottom:4px}
.opt{display:flex;gap:8px;align-items:flex-start;cursor:pointer;min-height:30px}
.opt input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--accent)}
.opt.off{opacity:.5;cursor:not-allowed}
.opt small{display:block;color:var(--muted)}
.corr{grid-column:1/-1;padding:10px 12px;background:var(--tiza-bg);border-left:4px solid var(--tiza)}
.corr b{color:var(--red)}
.corr ul{margin:4px 0 8px;padding-left:20px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--tint);color:var(--ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.mute{background:transparent;border:1px solid var(--line);color:var(--muted)}

/* Mis inscripciones */
.mis{display:grid;gap:10px}
.ins{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line)}
.ins.baja{opacity:.62}
.ins h3{font-size:1rem}
.ins .meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:.9rem}
.ins .acc{grid-row:1/span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
@media (max-width:560px){.ins{grid-template-columns:1fr}.ins .acc{grid-row:auto;grid-column:1;align-items:stretch;text-align:left}}
.carsel{display:flex;gap:10px;flex-wrap:wrap}
.carbtn{flex:1 1 200px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;border-radius:4px;display:flex;flex-direction:column;gap:2px}
.carbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);box-shadow:inset 4px 0 0 var(--accent)}
.carbtn b{font-size:.95rem}
.carbtn span{font-size:.8rem;color:var(--muted)}
.sticky-bar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 -6px 18px rgba(0,0,0,.08)}

/* Panel administrativo */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);background:var(--surface)}
.stat{padding:10px 14px;display:flex;flex-direction:column}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;align-items:end}
.tblwrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{background:var(--tint);text-align:left;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
tr.fila{cursor:pointer}
tr.fila:hover td{background:var(--tint)}
tr.fila.vacia td{color:var(--muted)}
tr.det-row>td{background:var(--bg);padding:14px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.roster td,.roster th{padding:6px 8px}
.roster tr.no td{text-decoration:line-through;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.hdr-det{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.hdr-det .tiempos{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;z-index:20;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.skel{height:64px;background:linear-gradient(90deg,var(--tint),var(--surface),var(--tint));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
details>summary{cursor:pointer;font-weight:600}
</style>
</head>

/* Lee todos los códigos que haya en un texto pegado (mails, whatsapp, etc.) */
function leerCodigos(txt) {
  const re = /ISP66\.([A-Za-z0-9_\-\s]+?)\.([0-9a-z]{7})(?![0-9a-z])/g, out = []; let m;
  while ((m = re.exec(txt || ''))) {
    const body = m[1].replace(/\s+/g, '');
    if (ckOf(body) !== m[2]) { out.push({ err: 'Código incompleto o modificado (' + body.slice(0, 12) + '…)' }); continue; }
    try {
      const o = JSON.parse(b64d(body));
      if (!o || o.v !== 1 || !CARRERAS[o.c] || !/^\d{7,8}$/.test(String(o.d)) || !Array.isArray(o.i) || !o.i.length || !(o.t > 0)) throw new Error('formato');
      const evs = [];
      o.i.forEach(x => {
        const id = o.c + '-' + x[0];
        if (!MB[id] || (x[1] !== 1 && x[1] !== 2) || (x[5] !== 'a' && x[5] !== 'b')) throw new Error('mesa');
        evs.push({ dni: String(o.d), ap: String(o.a || '').slice(0, 80), no: String(o.n || '').slice(0, 80), tel: String(o.tl || '').slice(0, 40), em: String(o.em || '').slice(0, 80), li: String(o.li || '').slice(0, 30), m: id, l: x[1], c: x[2] === 'L' ? 'L' : 'R', k: String(x[3] || '').slice(0, 2), d: x[4] ? 1 : 0, e: x[5], t: Math.round(o.t) });
      });
      out.push({ evs });
    } catch (e) { out.push({ err: 'Código con datos que no se reconocen (' + body.slice(0, 12) + '…)' }); }
  }
  return out;
}

function leerDatos(conContacto) {
  $$('.field.invalid').forEach(x => x.classList.remove('invalid'));
  $$('[data-err-f],[data-err]').forEach(x => { x.textContent = ''; }); $('#errGral').textContent = '';
  const g = id => { const e = $('#p_' + id); return e ? (e.value || '').trim() : ''; };
  const v = { apellidos: g('ap'), nombres: g('no'), dni: g('dni').replace(/[.\s]/g, ''), tel: g('tel'), email: g('email'), libreta: g('lib') };
  let bad = 0, first = null;
  const mark = (id, msg) => { fe(id, msg); bad++; first = first || $('[data-fld="' + id + '"]'); };
  if (!v.apellidos) mark('ap', 'Completá tus apellidos.');
  if (!v.nombres) mark('no', 'Completá tus nombres.');
  if (!/^\d{7,8}$/.test(v.dni)) mark('dni', 'Ingresá tu DNI con 7 u 8 números.');

    if ((v.tel.match(/\d/g) || []).length < 6) mark('tel', 'Ingresá un teléfono de contacto.');

  const b = e.target.closest('[data-a]');
  if (!b) { const tr = e.target.closest('tr.fila'); if (tr) { const k = tr.dataset.k; if (S.open.has(k)) S.open.delete(k); else S.open.add(k); renderAdminList(); } return; }
  const a = b.dataset.a;
  if (a === 'pago') { const key = b.dataset.key; await setRev('pago_' + key, { pago: b.checked }); return; }
  if (a === 'ver') return setRev(b.dataset.rk, { st: 'ok' });
  if (a === 'no') return setRev(b.dataset.rk, { st: 'no' });
  if (a === 'pend') return setRev(b.dataset.rk, { st: null });
  if (a === 'del') { const id = b.dataset.id; if (S.cbAdm === id) { S.cbAdm = null; try { await S.db.doc('manuales/' + id).delete(); } catch (er) { toast('No se pudo quitar.'); } } else { S.cbAdm = id; renderAdminList(); setTimeout(() => { if (S.cbAdm === id) { S.cbAdm = null; renderAdminList(); } }, 5000); } return; }
  if (a === 'acta') return generarActas(bloquesDe(porKey(b.dataset.k), true), 'Acta_volante_' + slugF(MB[b.dataset.k.split('|')[0]].materia) + '_' + b.dataset.k.split('|')[1] + 'llamado');
  if (a === 'xlsx') return generarExcel(bloquesDe(porKey(b.dataset.k), false), 'Listado_' + slugF(MB[b.dataset.k.split('|')[0]].materia) + '_' + b.dataset.k.split('|')[1] + 'llamado');
  if (a === 'ficha') { const l = fichasDe(ROWS.filter(r => r.key === b.dataset.key && MB[r.m].car === b.dataset.car)); return generarFichas(l, 'Ficha_inscripcion_' + (l[0] ? l[0].p.dni : 'alumno')); }
  if (a === 'fichasAll') { const rows = []; listaML().forEach(x => (BYML[x.m.id + '|' + x.l] || []).forEach(r => rows.push(r))); return generarFichas(fichasDe(rows), nombreArchivo('Fichas')); }
  if (a === 'xlsxAll') return generarExcel(bloquesDe(listaML(), false), nombreArchivo('Listado'));
  if (a === 'actasAll') return generarActas(bloquesDe(listaML(), true), nombreArchivo('Actas'));
  if (a === 'add') { S.add = { k: b.dataset.k, ap: '', no: '', dni: '', lib: '', c: 'R', k2: '' }; S.add.kk = ''; renderAdminList(); return; }
  if (a === 'addcancel') { S.add = null; renderAdminList(); return; }
  if (a === 'addsave') {
    const ad = S.add, p = ad.k.split('|'), m = MB[p[0]], dni = ad.dni.replace(/[.\s]/g, '');
    if (!ad.ap.trim() || !ad.no.trim() || !/^\d{7,8}$/.test(dni)) { $('#adErr').textContent = 'Completá apellidos, nombres y un DNI de 7 u 8 números.'; return; }
    try { await S.db.collection('manuales').add({ m: m.id, l: +p[1], apellidos: ad.ap.trim(), nombres: ad.no.trim(), dni, libreta: ad.lib.trim(), c: ad.c, k: ad.kk || '', t: Date.now() }); S.add = null; toast('Estudiante agregado.'); } catch (er) { $('#adErr').textContent = 'No se pudo agregar.'; }
    return;
  }
  if (a === 'cfgsave') return guardarCfg();
  if (a === 'cargar') return cargarCodigos();
});
$('#vistaAdmin').addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'fQ') { S.q = t.value; renderAdminList(); return; }
  if (S.add && /^ad_/.test(t.id)) { const k = t.id.slice(3); S.add[k === 'k' ? 'kk' : k] = t.value; }
});
$('#vistaAdmin').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fCar') S.fCar = t.value; else if (t.id === 'fLl') S.fLl = t.value; else if (t.id === 'fFecha') S.fFecha = t.value; else if (t.id === 'fSolo') S.soloCon = t.checked; else if (t.id === 'fPago') { S.soloPago = t.checked; return; } else if (/^ad_/.test(t.id)) { S.add[t.id === 'ad_k' ? 'kk' : t.id.slice(3)] = t.value; return; } else return;
  renderAdminList();
});
$('#vistaAdmin').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr.fila')) { e.preventDefault(); e.target.click(); } });

/* ---------- Arranque ---------- */
let rafT = 0, dirty = {};
function refresh(what) { dirty[what] = 1; if (!rafT) rafT = requestAnimationFrame(() => { rafT = 0; const d = dirty; dirty = {}; if (d.cfg) { renderPlazos(); renderForm(); if (S.isAdmin && S.tab === 'adm' && $('#admCfg') && !$('#admCfg').open) buildCfg(); } if (d.adm && S.isAdmin && $('#admList')) { renderAdminList(); } }); }
function setTab(t) {
  S.tab = t; $('#vistaAlumno').hidden = t !== 'insc'; $('#vistaAdmin').hidden = t !== 'adm'; $('.wrap').classList.toggle('wide', t === 'adm');
  $$('.tab[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  if (t === 'adm') { if (!$('#admList')) buildAdmin(); renderAdminList(); }
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.tab); });

/* La parte del estudiante no depende de ninguna cuenta ni base de datos: se muestra de inmediato */
renderPlazos(); renderAvisos(); renderRes(); renderForm();
S.db = await useCap('db'); S.user = await useCap('user');
if (S.user) { try { S.uid = await S.user.id(); S.isAdmin = await S.user.canEdit(); S.canWrite = await S.user.can('data.write'); } catch (e) { /* sin identidad */ } }
if (S.isAdmin) $('#tabs').hidden = false;
if (S.db && S.isAdmin) {
  const onErr = () => { };
  S.db.doc('config/main').onSnapshot(s => { cfg = Object.assign({}, CFG_DEF, s.exists ? s.data() : {}); refresh('cfg'); refresh('adm'); }, onErr);
  S.db.collection('codigos').onSnapshot(q => { S.cod = q.docs.map(d => Object.assign({ id: d.id }, d.data())); S.codIds = new Set(q.docs.map(d => d.id)); refresh('adm'); }, onErr);
  S.db.collection('revisiones').onSnapshot(q => { S.revs = {}; q.docs.forEach(d => { S.revs[d.id] = d.data(); }); refresh('adm'); }, onErr);
  S.db.collection('manuales').onSnapshot(q => { S.man = q.docs.map(d => Object.assign({ id: d.id }, d.data())); refresh('adm'); }, onErr);
}
let lastOpen = inscAbierta(Date.now());
setInterval(() => {
  renderPlazos();
  const o = inscAbierta(Date.now()); if (o !== lastOpen) { lastOpen = o; const ae = document.activeElement; if (!(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && $('#formSec').contains(ae))) renderForm(); }
  const ae = document.activeElement; if (S.isAdmin && S.tab === 'adm' && $('#admList') && !(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && $('#vistaAdmin').contains(ae))) renderAdminList();
}, 30000);
})();
</script>
